name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse personal data
        run: |
          # The repo is public. The only spreadsheet allowed is the clean template; no CSV exports at all.
          bad=$(git ls-files '*.csv' '*.xlsx' '*.xls' | grep -v '^template/format-timesheet-clean\.xlsx$' || true)
          if [ -n "$bad" ]; then echo "::error::These files must not be committed: $bad"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rule tests (synthetic data)
        run: |
          pip install vendor/et_xmlfile-2.0.0-py3-none-any.whl vendor/openpyxl-3.1.5-py2.py3-none-any.whl
          python tests/test_rules.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html app.js worker.js style.css _site/
          cp -r py vendor template _site/
          touch _site/.nojekyll
          # cache-bust the Python files and worker on every deploy
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${GITHUB_SHA::8}'/" _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
