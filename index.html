<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timesheet Converter</title>
  <meta name="description" content="Turn a Jibble Monthly Raw Time Entries CSV into the FORMAT Timesheet workbook. Runs in your browser; nothing is uploaded.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='%231f7a4d'/%3E%3Cpath d='M3 12h26' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M9 18h4M15 18h4M21 18h2M9 23h4M15 23h4' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>Timesheet Converter</h1>

  <section class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".csv,text/csv">
      <span class="title" id="name">Import Jibble raw data (.csv)</span>
      <span class="hint" id="info"></span>
    </label>

    <button class="btn" id="export" disabled>Export timesheet</button>
    <p class="msg" id="msg"></p>
    <div id="summary"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
